# Publica o pacote no pub.dev quando uma tag de versão é enviada (ex.: v1.2.0).
#
# Autenticação por OIDC (sem token salvo no repositório). Configuração única no pub.dev:
#   pub.dev > pacote > Admin > Automated publishing > Enable publishing from GitHub Actions
#   Repository: <owner>/<repo>  |  Tag pattern: v{{version}}  |  Environment: pub.dev
#
# Para publicar:
#   1. Atualize `version:` no pubspec.yaml e o CHANGELOG.md e faça o commit.
#   2. git tag v<versão> && git push origin v<versão>
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Tag deve ser igual à versão do pubspec.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d "\"'")"
          echo "tag=$tag pubspec=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::A tag v$tag não corresponde à versão $version do pubspec.yaml"
            exit 1
          fi
          if ! grep -qE "^## \[?$version\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md não tem uma entrada para a versão $version"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: |
          if [ -d test ]; then flutter test; else echo "Sem pasta test/"; fi

  publish:
    name: Publicar
    needs: verify
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # necessário para a autenticação OIDC no pub.dev
    steps:
      - uses: actions/checkout@v4

      # Configura o token OIDC do pub.dev (usado também pelo dart do Flutter).
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart pub publish --force
