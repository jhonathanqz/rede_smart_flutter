name: rede_payment_tech
description: "Flutter plugin for Rede Android smart POS terminals using the Rede Smart SDK: credit, debit, voucher, PIX, installments, reversal, reprint and PIN auth."
version: 2.0.0
homepage: https://github.com/jhonathanqz/rede_smart_flutter
repository: https://github.com/jhonathanqz/rede_smart_flutter
issue_tracker: https://github.com/jhonathanqz/rede_smart_flutter/issues
topics:
  - payment
  - pos
  - android
  - flutter-plugin
  - brazil

environment:
  sdk: ^3.5.4
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.rede_payment_tech
        pluginClass: RedeTechFlutterPlugin
      ios:
        pluginClass: RedeTechFlutterPlugin
